<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>torodem — gallery</title>
    <link rel="stylesheet" href="https://unpkg.com/@spiritov/ds.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="ds-grid page">
        <div class="bar ds-darkpurple titlebar">torodem ●●●</div>

        <main class="wide">
            <nav>
                <a href="/"><button>home</button></a>
                <a href="/gallery"><button class="ds-darkpurple">gallery</button></a>
                <a href="/server"><button>server</button></a>
                <a href="/contact"><button>contact</button></a>
                <button class="button-lg" disabled>chat (under construction)</button>
            </nav>

            <div class="alert">
                <p>♪ new track out now: synchronised by torodem</p>
                <a href="https://torodem.bandcamp.com/track/synchronised" target="_blank" rel="noopener"><button>listen</button></a>
            </div>

            <div>
                <h1>gallery</h1>
                <p class="sub">viewing project archive</p>
                <p class="sub">random artwork, some 2d, some renders</p>
            </div>

            <div class="gallery">
                <figure class="shot">
                    <a href="https://torodem.bandcamp.com/track/synchronised" target="_blank" rel="noopener"><img src="https://f4.bcbits.com/img/a3197474758_5.jpg" alt="synchronised cover art"></a>
                    <figcaption>synchronised — torodem</figcaption>
                </figure>
                <figure class="shot">
                    <img src="bluesypegordon.jpg" alt="bluesypegordon">
                    <figcaption>bluesypegordon</figcaption>
                </figure>
                <figure class="shot">
                    <img src="eli.png" alt="eli">
                    <figcaption>eli</figcaption>
                </figure>
                <figure class="shot">
                    <img src="fc.png" alt="fc">
                    <figcaption>fc</figcaption>
                </figure>
                <figure class="shot">
                    <img src="fv.png" alt="fv">
                    <figcaption>fv</figcaption>
                </figure>
                <figure class="shot">
                    <img src="myf.png" alt="myf">
                    <figcaption>myf</figcaption>
                </figure>
                <figure class="shot">
                    <img src="nathanred.png" alt="nathanred">
                    <figcaption>nathanred</figcaption>
                </figure>
                <figure class="shot">
                    <img src="ocean.png" alt="ocean">
                    <figcaption>ocean</figcaption>
                </figure>
                <figure class="shot">
                    <img src="water.png" alt="water">
                    <figcaption>water</figcaption>
                </figure>
                <figure class="shot">
                    <img src="yep.png" alt="yep">
                    <figcaption>yep</figcaption>
                </figure>
            </div>

            <p class="sub">more projects and music coming eventually..</p>

            <div class="pictochat-window">
                <div class="pictochat-message">
                    <header class="ds-turquoise-50">🎧 now playing</header>
                    <p><a href="https://torodem.bandcamp.com/track/synchronised" target="_blank" rel="noopener">synchronised</a> — torodem</p>
                    <iframe style="height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/track=338934521/size=large/bgcol=ffffff/linkcol=0687f5/tracklist=false/artwork=small/transparent=true/" seamless></iframe>
                    <p>up next: <a href="https://torodem.bandcamp.com/track/tremolo" target="_blank" rel="noopener">tremolo</a> — torodem</p>
                </div>
            </div>

            <footer>
                <p>made using <a href="https://github.com/spiritov/ds.css" target="_blank" rel="noopener">ds.css</a> from spiritov</p>
            </footer>
        </main>
    </div>
</body>
</html>
