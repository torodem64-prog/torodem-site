<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>torodem — gallery</title>

<link rel="icon" type="image/svg+xml" href="./assets/svg/favicon.svg">

<!-- ds.css — DS Lite UI framework: https://github.com/spiritov/ds.css -->
<link rel="stylesheet" href="./assets/css/ds.css">

<style>
  body {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 2em;
    margin-bottom: 12px;
  }
  nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
  }
  section {
    margin-top: 28px;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-top: 16px;
  }
  .gallery-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .gallery-frame {
    width: 100%;
    aspect-ratio: 4 / 3;
    border: 2px solid #000;
    background: #fff;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .gallery-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
  }
  .gallery-item .pictochat-status {
    text-align: center;
    width: 100%;
  }

  .note-text {
    text-align: center;
    margin-top: 32px;
    font-size: 0.85em;
    color: var(--color-ds-darkgrey);
  }
</style>
</head>
<body class="ds">

<header>
  <h1>gallery</h1>
  <nav>
    <button class="bg-ds-theme-blue" onclick="location.href='https://torodem.com/index.html'">home</button>
    <button class="bg-ds-theme-turquoise" onclick="location.href='https://torodem.com/gallery.html'">gallery</button>
    <button class="bg-ds-theme-lime" onclick="location.href='https://torodem.com/contact.html'">contact</button>
    <button class="bg-ds-theme-orange" onclick="location.href='https://under construction sorry'">chat (under construction)</button>
  </nav>
</header>

<div class="bar-lg bg-ds-theme-turquoise"></div>

<!-- ===================== PROJECT ARCHIVE ===================== -->
<section>
  <div class="pictochat-window">
    <div class="pictochat-message">viewing project archive</div>
    <div class="pictochat-status">random artwork, some 2d, some renders</div>
  </div>

  <div class="gallery-grid">
    <div class="gallery-item">
      <div class="gallery-frame">
        <img src="https://torodem.neocities.org/homer.png" alt="homer" loading="lazy">
      </div>
      <div class="pictochat-status">homer</div>
    </div>

    <div class="gallery-item">
      <div class="gallery-frame">
        <img src="https://torodem.neocities.org/scb3.avif" alt="scb3" loading="lazy">
      </div>
      <div class="pictochat-status">scb3</div>
    </div>

    <div class="gallery-item">
      <div class="gallery-frame">
        <img src="https://torodem.neocities.org/scb2.avif" alt="scb2" loading="lazy">
      </div>
      <div class="pictochat-status">scb2</div>
    </div>

    <div class="gallery-item">
      <div class="gallery-frame">
        <img src="https://torodem.neocities.org/scb1.avif" alt="scb1" loading="lazy">
      </div>
      <div class="pictochat-status">scb1</div>
    </div>
  </div>

  <p class="note-text">more projects and music coming eventually..</p>
</section>

<div class="bar-lg-reverse bg-ds-theme-teal" style="margin-top: 32px;"></div>

</body>
</html>
